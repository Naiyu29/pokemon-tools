<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>Champions 對戰工具</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#101418; --panel:#1a2027; --panel2:#222a33; --line:#2e3843;
  --tx:#e8edf2; --tx2:#9aa7b5; --acc:#4da3ff; --mine:#57d18a; --foe:#ff7a6e;
  --ko1:#ff5c4d; --ko1r:#ff9d4d; --ko2:#ffd24d; --ko2r:#c9e05a; --ko3:#7fd0ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Noto Sans TC",sans-serif}
body{padding-bottom:64px}
header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);
  padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin-right:auto}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:none;color:var(--tx2);padding:5px 10px;font-size:13px}
.seg button.on{background:var(--acc);color:#03121f;font-weight:700}
select,input[type=search],textarea{background:var(--panel2);color:var(--tx);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;font-size:14px}
main{padding:10px 12px;max-width:720px;margin:0 auto}
.tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--panel);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;background:none;border:none;color:var(--tx2);padding:10px 0 8px;font-size:12.5px}
.tabbar button.on{color:var(--acc);font-weight:700}
.tabbar button .ic{display:block;font-size:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px}
.card h2{font-size:14px;color:var(--tx2);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);
  border-radius:16px;padding:4px 10px;font-size:14px}
.chip.known{border-color:var(--acc)}
.chip.unknown{border-color:#888;border-style:dashed}
.chip .x{color:var(--tx2);font-weight:700;padding:0 2px}
.chip.sel{background:var(--acc);color:#03121f;font-weight:700}
.hint{color:var(--tx2);font-size:12.5px;margin:4px 0}
.results{margin-top:6px}
.result{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid var(--line)}
.result:active{background:var(--panel2)}
.result .zh{font-size:15px}
.result .en{color:var(--tx2);font-size:12.5px}
.badge{font-size:11px;border-radius:6px;padding:1px 6px;margin-left:auto}
.badge.k{background:#123a5e;color:var(--acc)}
.badge.u{background:#333;color:var(--tx2)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:5px 6px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--tx2);font-weight:500;font-size:12px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{font-size:11.5px;font-weight:700;border-radius:5px;padding:1px 6px;color:#03121f;display:inline-block}
.tag.ko1{background:var(--ko1);color:#fff}.tag.ko1r{background:var(--ko1r)}
.tag.ko2{background:var(--ko2)}.tag.ko2r{background:var(--ko2r)}
.tag.ko3{background:var(--ko3)}.tag.ko0{background:#3a4653;color:var(--tx2)}
.mine{color:var(--mine)}.foename{color:var(--foe)}
.spebar{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--line);font-size:14px}
.spebar .val{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700}
.spebar .mod{color:var(--tx2);font-size:11.5px}
.spebar.bench{opacity:.72;background:rgba(255,255,255,.025)}
.sbadge{font-size:10.5px;font-weight:700;border-radius:5px;padding:0 5px;flex:none}
.sbadge.m{background:#12452a;color:var(--mine)}
.sbadge.f{background:#4a1d18;color:var(--foe)}
.sbadge.b{background:#333;color:var(--tx2)}
.same{background:#3a2d10}
.reco{border-left:4px solid var(--line)}
.reco.pick{border-left-color:var(--mine)}
.reco .head{display:flex;align-items:center;gap:8px}
.reco .score{margin-left:auto;font-weight:800;font-size:17px}
.reco ul{margin:6px 0 0 18px;color:var(--tx2);font-size:13px}
.leadtag{background:var(--mine);color:#03140a;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px}
.foe-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.foe-tabs .chip{flex:none;white-space:nowrap}
.group-title{margin:10px 0 2px;font-size:14px;font-weight:700}
.toggles{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tgl{background:var(--panel2);border:1px solid var(--line);color:var(--tx2);border-radius:8px;padding:5px 10px;font-size:13px}
.tgl.on{border-color:var(--acc);color:var(--acc);font-weight:700}
dialog{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:12px;
  width:min(94vw,560px);padding:14px}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog textarea{width:100%;min-height:180px;font:12.5px/1.4 ui-monospace,monospace;margin:8px 0}
.btn{background:var(--acc);color:#03121f;border:none;border-radius:8px;padding:8px 14px;font-size:14px;font-weight:700}
.btn.ghost{background:var(--panel2);color:var(--tx);border:1px solid var(--line)}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--tx2);text-align:center;padding:30px 0}
.recrow{padding:8px 4px;border-bottom:1px solid var(--line);font-size:13.5px}
.recrow .top{display:flex;gap:8px;align-items:center}
.recrow .time{color:var(--tx2);font-size:12px}
.recrow .foes{color:var(--tx2);font-size:12.5px;margin-top:2px}
.recrow .note{color:var(--tx);font-size:12.5px;margin-top:2px}
.recrow .x{margin-left:auto;color:var(--tx2);font-weight:700;padding:0 4px}
.wl{font-weight:800;border-radius:6px;padding:1px 8px;font-size:12px}
.wl.W{background:#12452a;color:var(--mine)}
.wl.L{background:#4a1d18;color:var(--foe)}
.statrow{display:flex;gap:14px;font-size:14px;flex-wrap:wrap}
.statrow b{font-size:17px}
.banner{max-width:720px;margin:10px auto 0;padding:8px 12px;border-radius:10px;font-size:13.5px;
  display:flex;gap:8px;align-items:center;background:#123a5e;color:#cfe6ff;border:1px solid var(--acc)}
.banner.err{background:#4a1d18;color:#ffd9d4;border-color:var(--foe)}
.banner .x{margin-left:auto;font-weight:700;padding:0 4px}
/* ---- 隊伍分頁（清單 ↔ 編輯，參考 Showdown teambuilder 的兩層結構）---- */
.badge.w{background:#4a3a12;color:#ffd24d}
.btn.sm{padding:5px 10px;font-size:13px;font-weight:600}
.btn.danger{color:var(--foe);border-color:#5b2b26}
.tcard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);
  border-radius:12px;padding:10px 12px;margin:0 0 10px}
.tcard.on{border-left-color:var(--mine)}
.tcard .head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tcard .head b{font-size:15px}
.tcard .head .badge{margin-left:0}
.tcard .cnt{margin-left:auto;color:var(--tx2);font-size:12px}
.tcard .mons{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tcard .mon{display:inline-flex;align-items:center;gap:4px;background:var(--panel2);
  border:1px solid var(--line);border-radius:8px;padding:3px 7px;font-size:13px}
.tchip{font-size:10px;font-weight:700;color:#0b0f13;border-radius:4px;padding:0 4px}
.tcard .acts{display:flex;gap:6px;flex-wrap:wrap}
.tbbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.tbbar input{flex:1;min-width:0;background:var(--panel2);color:var(--tx);border:1px solid var(--line);
  border-radius:8px;padding:7px 10px;font-size:15px;font-weight:700}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:0 0 8px}
.slot.open{border-color:var(--acc)}
.slot .shead{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.slot .shead b{font-size:15px}
.slot .idx{width:20px;height:20px;flex:none;display:grid;place-items:center;background:var(--panel2);
  border-radius:6px;color:var(--tx2);font-size:11px;font-weight:700}
.slot .chev{margin-left:auto;color:var(--tx2)}
.slot .sline{color:var(--tx);font-size:12.5px;margin-top:3px;padding-left:26px}
.slot .sline.dim{color:var(--tx2)}
.slot .sbody{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.fld{display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:relative}
.fld>span{width:60px;flex:none;color:var(--tx2);font-size:12.5px}
.fld select{flex:1;min-width:0}
.fldbtn{flex:1;min-width:0;text-align:left;background:var(--panel2);color:var(--tx);
  border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px}
.fldbtn.on{border-color:var(--acc);color:var(--acc)}
.picker{flex-basis:100%;background:var(--panel2);border:1px solid var(--acc);border-radius:10px;padding:8px}
.picker input{width:100%}
.picker .results{max-height:230px;overflow-y:auto}
.evbox{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.evhead{color:var(--tx2);font-size:12.5px;margin-bottom:4px}
.evhead b{color:var(--mine);font-size:14px}
.evhead b.over{color:var(--foe)}
.evrow{display:flex;align-items:center;gap:8px;margin:3px 0}
.evname{width:42px;flex:none;color:var(--tx2);font-size:12.5px}
.evrow input[type=range]{flex:1;min-width:0;accent-color:var(--acc)}
.evrow input[type=number]{width:64px;flex:none;background:var(--panel);color:var(--tx);
  border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:13px;text-align:right}
.evsp{width:34px;flex:none;color:var(--tx2);font-size:11.5px;text-align:right}
.evhead .over{color:var(--foe)}
.result.none .zh{color:var(--tx2);font-size:13px}
.mvbox{display:flex;flex-direction:column;gap:8px}
#tbOut{width:100%;min-height:150px;font:12.5px/1.4 ui-monospace,monospace;margin:6px 0}
footer.note{color:var(--tx2);font-size:11.5px;padding:8px 2px}
#recogView{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding-bottom:20px}
#recogView .bar{position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;gap:8px;align-items:center;padding:8px 12px}
#recogView .bar h2{font-size:15px;margin-right:auto}
#recogView .inner{padding:10px 12px;max-width:720px;margin:0 auto}
#rgCanvas{width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--line);touch-action:manipulation}
#rgCands{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.autorow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;align-items:stretch}
.autorow .cand{flex:0 0 auto;width:86px;padding:6px 6px;font-size:13px;flex-direction:column;gap:2px}
.autorow .cand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.autorow .cand.more{width:56px;justify-content:center;color:var(--tx2)}
.autorow .cardno{flex:none;align-self:center;padding:0 4px}
.rgsearch{background:var(--panel);border:1px solid var(--acc);border-radius:10px;padding:8px}
.rgsearch input{width:100%}
.cand{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:8px 12px;color:var(--tx);font-size:15px;text-align:left}
.cand:active{border-color:var(--acc)}
.cand.sel{border-color:var(--mine);background:#12301f}
.cand canvas{width:36px;height:36px;image-rendering:pixelated;background:var(--panel2);border-radius:6px}
.cand .pct{color:var(--tx2);font-variant-numeric:tabular-nums;font-size:12px}
#rgCands>.cand .pct{margin-left:auto}
.sizerow{display:flex;align-items:center;gap:10px;margin-top:8px;color:var(--tx2);font-size:13px}
.sizerow input{flex:1}
#teamRecogView{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding-bottom:20px}
#teamRecogView .bar{position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;gap:8px;align-items:center;padding:8px 12px}
#teamRecogView .bar h2{font-size:15px;margin-right:auto}
#teamRecogView .inner{padding:10px 12px;max-width:720px;margin:0 auto}
.trslot{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-left:4px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.trslot.ok{border-left-color:var(--mine)}
.trslot .t{display:flex;flex-direction:column;min-width:0}
.trslot .t b{font-size:14.5px}
.trslot .s{margin-left:auto;font-size:12.5px;white-space:nowrap}
.trslot .s .ok{color:var(--mine)}
.trslot .s .err{color:var(--foe);white-space:normal}
.trrow{border-top:1px solid var(--line);padding:8px 2px;font-size:13px}
.trrow:first-of-type{border-top:none}
.trrow.warn{background:rgba(255,210,77,.06)}
.trrow .n{display:flex;gap:8px;align-items:baseline}
.trrow .n b{font-size:15px}
.trrow .d{color:var(--tx2);margin-top:2px}
.trrow .w{color:var(--ko2);margin-top:3px;font-size:12.5px}
.autorow .cand.zh{width:104px}
.autorow .cand.zh span:first-of-type{font-size:14px}
#recogView .bar h2{font-size:15px;margin-right:6px}

/* ================= 電腦版版面（參考 Showdown damage calc／teambuilder、Pikalytics 的作法） =================
   手機：底部分頁列，一次一頁；電腦：左側導覽＋「對戰分析」四個面板同畫面並排，不用切頁。 */
.sidenav{display:none}
.ws{display:grid;gap:12px}
.ws-head{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--tx2);margin:0 0 6px}
.ws-head::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--acc)}
.ws-head .n{margin-left:auto;font-weight:500}
.dmg-grid{display:grid;gap:10px;grid-template-columns:1fr}
.dmg-grid .card{margin:0;overflow-x:auto}
.reco-grid{display:grid;gap:10px;grid-template-columns:1fr}
.reco-grid .card{margin:0}
@media (hover:hover){
  button,.result,.chip .x,.recrow .x{cursor:pointer}
  .result:hover{background:var(--panel2)}
  .btn:hover{filter:brightness(1.1)}
  .tgl:hover,.seg button:hover,.fldbtn:hover{color:var(--tx);border-color:#42505d}
  .chip .x:hover,.recrow .x:hover{color:var(--foe)}
  .cand:hover{border-color:var(--acc)}
  .tcard:hover,.slot:hover{border-color:#3d4a57}
  tbody tr:hover{background:rgba(255,255,255,.035)}
  .spebar:hover{background:rgba(255,255,255,.035)}
  .sidenav button:hover{background:var(--panel2);color:var(--tx)}
}
@media (min-width:1024px){
  body{padding-bottom:0}
  header{padding:8px 18px;min-height:50px;flex-wrap:nowrap}
  header h1{font-size:17px}
  .tabbar{display:none}
  .banner{max-width:none;margin:10px 18px 0}
  .shell{display:grid;grid-template-columns:184px minmax(0,1fr);align-items:start;
    max-width:1760px;margin:0 auto}
  .sidenav{display:flex;flex-direction:column;gap:3px;padding:12px 10px;
    position:sticky;top:50px;height:calc(100vh - 50px);border-right:1px solid var(--line)}
  .sidenav button{display:flex;align-items:center;gap:9px;background:none;
    border:1px solid transparent;border-radius:9px;color:var(--tx2);
    padding:9px 10px;font-size:14px;text-align:left}
  .sidenav button.on{background:var(--panel2);border-color:var(--acc);color:var(--acc);font-weight:700}
  .sidenav .ic{font-size:16px;flex:none}
  .sidenav .foot{margin-top:auto;color:var(--tx2);font-size:11.5px;line-height:1.9;padding:0 2px}
  .sidenav kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;
    padding:0 4px;font:11px/1.6 ui-monospace,monospace}
  main{max-width:none;margin:0;padding:14px 18px}
  /* 對戰分析工作區：固定一個畫面高，每欄各自捲動（整頁不捲），
     對手／速度線永遠留在畫面上不會被捲走 */
  .ws{gap:12px;height:calc(100vh - 78px);
    grid-template-columns:300px minmax(0,1fr) 320px}
  .ws>*{min-height:0}
  .ws-col{overflow-y:auto;overflow-x:hidden;padding-right:4px}
  /* 中間欄上下各半：推薦與傷害矩陣都留在畫面上，各自捲動 */
  .ws-mid{display:grid;gap:12px;overflow:hidden;min-height:0;
    grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
  .ws-col>.ws-head{position:sticky;top:0;z-index:1;background:var(--bg);padding:2px 0 6px;margin:0}
  .ws .card,.ws .reco{margin-bottom:10px}
  .ws footer.note{padding-top:2px}
  .picker .results{max-height:320px}
  /* 隊伍分頁：清單兩欄（編輯頁維持單欄，欄位才不會被拉太寬） */
  .tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
  .tlist .tcard{margin:0}
  #tbEdit{max-width:760px}
  /* 紀錄分頁：登錄／統計 與 歷史 並排 */
  .recwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px;align-items:start}
  /* 辨識視窗：左圖右候選 */
  #recogView .inner{max-width:1280px;display:grid;gap:14px;
    grid-template-columns:minmax(0,1fr) 400px;align-items:start}
  #recogView .rgstat{grid-column:1/-1;margin:0}
  #recogView .rgright{position:sticky;top:60px;max-height:calc(100vh - 76px);overflow:auto}
  .autorow .cand{width:96px}
  .autorow .cand.zh{width:118px}
}
@media (min-width:1024px) and (max-width:1279px){
  /* 窄桌面（1024～1279，例如平板橫放）：導覽列與側欄一起縮，中間欄才夠寬 */
  .shell{grid-template-columns:148px minmax(0,1fr)}
  .sidenav{padding:10px 6px;top:50px;height:calc(100vh - 50px)}
  .sidenav button{padding:8px;font-size:13px;gap:7px}
  .sidenav .foot{display:none}
  main{padding:12px}
  .ws{gap:8px;height:calc(100vh - 74px);grid-template-columns:222px minmax(0,1fr) 246px}
  .ws-mid{gap:8px}
  .reco .head b,.tcard .head b{white-space:nowrap}
}
@media (min-width:1600px){
  /* 夠寬就四欄全開：對手｜推薦｜傷害｜速度，各欄獨立捲動 */
  .ws{grid-template-columns:320px minmax(0,1fr) 340px}
  .ws-mid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
}
</style>
</head>
<body>
<header>
  <h1>⚔️ Champions</h1>
  <div class="seg" id="modeSeg">
    <button data-v="doubles">雙打</button><button data-v="singles">單打</button>
  </div>
  <select id="weatherSel" title="天氣">
    <option value="">無天氣</option><option value="Sun">晴天</option>
    <option value="Rain">雨天</option><option value="Sand">沙暴</option><option value="Snow">雪天</option>
  </select>
  <button class="tgl" id="teamBtn">隊伍</button>
</header>
<div id="banner" hidden></div>
<div class="shell">
  <nav class="sidenav" id="sidenav">
    <button data-nav="battle"><span class="ic">⚔️</span>對戰分析</button>
    <button data-nav="team"><span class="ic">🧩</span>隊伍</button>
    <button data-nav="rec"><span class="ic">📓</span>紀錄</button>
    <div class="foot">
      <div><kbd>/</kbd> 搜尋對手</div>
      <div><kbd>Enter</kbd> 加入第一筆</div>
      <div><kbd>Esc</kbd> 清空搜尋</div>
    </div>
  </nav>
  <main id="main"></main>
</div>
<nav class="tabbar" id="tabbar">
  <button data-tab="foes"><span class="ic">🎯</span>對手</button>
  <button data-tab="reco"><span class="ic">🏆</span>推薦</button>
  <button data-tab="speed"><span class="ic">⚡</span>速度</button>
  <button data-tab="dmg"><span class="ic">💥</span>傷害</button>
  <button data-tab="team"><span class="ic">🧩</span>隊伍</button>
  <button data-tab="rec"><span class="ic">📓</span>紀錄</button>
</nav>
<div id="teamRecogView" hidden>
  <div class="bar">
    <h2>📷 我方隊伍辨識</h2>
    <button class="tgl" id="trClose">✕</button>
  </div>
  <div class="inner">
    <p class="hint">在遊戲的「隊伍」畫面各截一張：<b>狀態</b>頁（六維＋點數）與<b>能力</b>頁（特性／道具／招式）。</p>
    <div id="trBody"></div>
    <p class="hint" id="trStatus"></p>
    <div class="rowbtns" style="margin-top:8px">
      <button class="btn" id="trCreate" disabled>先選一張截圖</button>
      <button class="btn ghost" id="trCancel">取消</button>
    </div>
  </div>
</div>
<div id="recogView" hidden>
  <div class="bar">
    <h2>📷 對手辨識</h2>
    <button class="tgl" id="rgPick">選圖</button>
    <button class="btn" id="rgDone">完成</button>
    <button class="tgl" id="rgClose">✕</button>
  </div>
  <div class="inner">
    <p class="hint rgstat" id="rgStatus"></p>
    <div class="rgleft">
      <canvas id="rgCanvas" width="0" height="0"></canvas>
      <div class="sizerow">框大小 <input type="range" id="rgSize" min="6" max="40" value="14"></div>
    </div>
    <div class="rgright">
    <div id="rgCands"></div>
    <div class="card" style="margin-top:10px"><h2>已選對手</h2><div id="rgPicked"></div></div>
    <footer class="note">端上樣板比對（不連網、零成本）。從遊戲「分享截圖」直接進到這裡，或按「選圖」挑選角/準備畫面截圖：自動偵測右側 6 張對手卡（綠框）各列 5 個候選，點候選改選、再點取消、按 🔍 搜尋自選；「取代對手」會整批換掉目前對手清單，之後在「紀錄」登錄勝敗會自動帶這批對手。實測 top1 約 93%、top5 100%；也可點圖示位置手動框（藍框）。</footer>
    </div>
  </div>
  <input type="file" id="rgFile" accept="image/*" hidden>
</div>
<script src="bundle.js"></script>
</body>
</html>
